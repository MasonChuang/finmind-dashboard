<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大盤報表 - FinMind V3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
         background: #f4f7fa; color: #333; font-size: 14px; }

  .header {
    background: linear-gradient(135deg, #2b5876, #4e4376);
    color: #fff; padding: 28px 48px; border-radius: 0 0 16px 16px;
  }
  .header h1  { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
  .header p   { opacity: .85; font-size: .9rem; }
  .header .back-link {
    display: inline-block; margin-top: 10px;
    color: rgba(255,255,255,.75); font-size: .82rem; text-decoration: none;
  }
  .header .back-link:hover { color: #fff; }

  .section { padding: 24px 48px 0; }
  .section h2 {
    font-size: .95rem; font-weight: 700; color: #2b5876;
    margin-bottom: 14px; padding-left: 10px;
    border-left: 4px solid #4e4376; letter-spacing: .04em;
  }

  .card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 20px 24px;
    margin-bottom: 4px;
  }

  /* ── TAIEX 摘要列 ── */
  .taiex-summary {
    display: flex; gap: 24px; align-items: baseline;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .taiex-price  { font-size: 2rem; font-weight: 800; color: #2b5876; }
  .taiex-change { font-size: 1.1rem; font-weight: 700; }
  .taiex-date   { font-size: .82rem; color: #999; }

  /* ── 騰落摘要列 ── */
  .ad-summary {
    display: flex; gap: 20px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .ad-pill {
    border-radius: 8px; padding: 6px 16px; font-size: .88rem; font-weight: 700;
  }
  .ad-pill.adv  { background: #e8f5e9; color: #2e7d32; }
  .ad-pill.dec  { background: #ffebee; color: #c62828; }
  .ad-pill.unch { background: #eceff1; color: #546e7a; }

  /* ── 產業切換 Tab ── */
  .tab-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .tab-btn {
    border: 2px solid #c0d0e0; border-radius: 8px;
    background: #fff; color: #555; padding: 6px 20px;
    font-size: .88rem; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .tab-btn:hover   { border-color: #4e4376; color: #4e4376; }
  .tab-btn.active  { background: #4e4376; border-color: #4e4376; color: #fff; }

  .chart-wrap { position: relative; }

  .footer {
    margin: 28px 48px 32px; color: #bbb;
    font-size: .76rem; text-align: center;
  }

  @media (max-width: 768px) {
    .header, .section, .footer { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>大盤報表</h1>
  <p>加權指數 · 騰落線 · 產業成交額</p>
  <a class="back-link" href="index.html">← 返回首頁</a>
</div>

<!-- ① 加權指數 -->
<div class="section" style="margin-top:24px">
  <h2>加權指數</h2>
  <div class="card">
    <div class="taiex-summary">
      <span class="taiex-price">37,132.02</span>
      <span class="taiex-change" style="color:#2e7d32">▲ 409.88（1.12%）</span>
      <span class="taiex-date">2026-04-16</span>
    </div>
    <div class="chart-wrap" style="height:320px">
      <canvas id="chartTaiex"></canvas>
    </div>
    <div style="margin-top:10px; font-size:.78rem; color:#888; display:flex; gap:18px; flex-wrap:wrap;">
      <span style="color:#2b5876">■ 收盤</span>
      <span style="color:#f59e0b">— MA5</span>
      <span style="color:#10b981">— MA20</span>
      <span style="color:#3b82f6">— MA60</span>
      <span style="color:#e11d48">— MA240</span>
    </div>
  </div>
</div>

<!-- ② 騰落線 -->
<div class="section" style="margin-top:20px">
  <h2>騰落線（A/D Line）</h2>
  <div class="card">
    <div class="ad-summary">
      <span class="ad-pill adv">上漲 1410 家</span>
      <span class="ad-pill dec">下跌 705 家</span>
      <span class="ad-pill unch">平盤 185 家</span>
    </div>
    <div class="chart-wrap" style="height:200px">
      <canvas id="chartAD"></canvas>
    </div>
    <div style="margin-top:16px">
      <div class="chart-wrap" style="height:120px">
        <canvas id="chartADBar"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- ③ 產業成交額 -->
<div class="section" style="margin-top:20px">
  <h2>產業成交額（億元）</h2>
  <div class="card">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('day',this)">日</button>
      <button class="tab-btn"        onclick="switchTab('week',this)">週（5日）</button>
      <button class="tab-btn"        onclick="switchTab('mon',this)">月（21日）</button>
    </div>
    <div class="chart-wrap" id="indChartWrap" style="height:520px">
      <canvas id="chartInd"></canvas>
    </div>
  </div>
</div>

<div class="footer">
  報告產出時間：2026-04-17 11:10 · 資料來源：FinMind · 僅含一般個股（排除 ETF / ETN）
</div>
